# ──────────────────────────────────────────────────────────────
# DOT Field — Test Configuration
# Uses H2 in-memory database and test JWT secret.
# ──────────────────────────────────────────────────────────────

# ── DataSource (H2 in-memory) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:dot_field_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Flyway (disabled for fast unit test isolation) ────────────
spring.flyway.enabled=false

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Security & JWT Test Secrets ──────────────────────────────
jwt.secret=404D635166546A576E5A7234753778214125442A472D4B6150645267556B5870
jwt.expiration=86400000
initial.admin.email=admin@example.com
cors.allowed-origins=http://localhost:5173

# ── Logging ──────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.dotfield=INFO
