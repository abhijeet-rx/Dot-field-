# ──────────────────────────────────────────────────────────────
# DOT Field — Test Configuration
# Uses H2 in-memory database so tests don't require PostgreSQL.
# ──────────────────────────────────────────────────────────────

# ── DataSource (H2 in-memory) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:dot_field_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Logging ──────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.dotfield=INFO
