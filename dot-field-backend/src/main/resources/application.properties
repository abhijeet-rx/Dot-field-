# ──────────────────────────────────────────────────────────────
# DOT Field — Application Configuration
# ──────────────────────────────────────────────────────────────

# ── Server ───────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── DataSource ───────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:dot_field;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ── Flyway Database Migration ────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Security & JWT Configuration ────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
initial.admin.email=${INITIAL_ADMIN_EMAIL:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ── Logging ──────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.dotfield=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false