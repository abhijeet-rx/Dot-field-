# ──────────────────────────────────────────────────────────────
# DOT Field — Application Configuration
# ──────────────────────────────────────────────────────────────

# ── Server ───────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── DataSource (PostgreSQL — no fallbacks, env vars required) ─
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Flyway Database Migration ────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Security & JWT Configuration ────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
initial.admin.email=${INITIAL_ADMIN_EMAIL:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Remotive External Job Source ─────────────────────────────
job.sources.remotive.enabled=${REMOTIVE_ENABLED:true}
job.sources.remotive.base-url=${REMOTIVE_BASE_URL:https://remotive.com/api/remote-jobs}
job.sources.remotive.connect-timeout=${REMOTIVE_CONNECT_TIMEOUT:5000}
job.sources.remotive.read-timeout=${REMOTIVE_READ_TIMEOUT:10000}

# ── Scheduled Job Ingestion Configuration ────────────────────
job.ingestion.scheduler.enabled=${JOB_INGESTION_SCHEDULER_ENABLED:true}
job.ingestion.scheduler.fixed-delay-ms=${JOB_INGESTION_SCHEDULER_FIXED_DELAY_MS:1800000}
job.ingestion.scheduler.initial-delay-ms=${JOB_INGESTION_SCHEDULER_INITIAL_DELAY_MS:60000}
job.ingestion.scheduler.max-results=${JOB_INGESTION_SCHEDULER_MAX_RESULTS:50}

# ── Logging ──────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.dotfield=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false