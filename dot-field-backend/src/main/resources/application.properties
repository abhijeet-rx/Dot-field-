# ──────────────────────────────────────────────────────────────
# DOT Field — Application Configuration
# ──────────────────────────────────────────────────────────────

spring.config.import=optional:file:.env[.properties]

# ── Server ───────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── DataSource (PostgreSQL — no fallbacks, env vars required) ─
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Flyway Database Migration ────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Security & JWT Configuration ────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.jwks-url=${JWT_JWKS_URL:}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
jwt.algorithm=${JWT_ALGORITHM:HS256}
initial.admin.email=${INITIAL_ADMIN_EMAIL:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ── Discovery & Canonicalization Configuration ───────────────
job.discovery.canonicalize-scheme=${JOB_CANONICALIZE_SCHEME:true}
rate.limiter.discovery.enabled=${RATE_LIMIT_DISCOVERY_ENABLED:true}
rate.limiter.discovery.capacity=${RATE_LIMIT_DISCOVERY_CAPACITY:100}
rate.limiter.discovery.refill-interval-seconds=${RATE_LIMIT_DISCOVERY_REFILL_SECONDS:60}

# ── Remotive External Job Source ─────────────────────────────
job.sources.remotive.enabled=${REMOTIVE_ENABLED:true}
job.sources.remotive.base-url=${REMOTIVE_BASE_URL:https://remotive.com/api/remote-jobs}
job.sources.remotive.connect-timeout=${REMOTIVE_CONNECT_TIMEOUT:5000}
job.sources.remotive.read-timeout=${REMOTIVE_READ_TIMEOUT:10000}

# ── Scheduled Job Ingestion Configuration ────────────────────
job.ingestion.scheduler.enabled=${JOB_INGESTION_SCHEDULER_ENABLED:false}
job.ingestion.scheduler.fixed-delay-ms=${JOB_INGESTION_SCHEDULER_FIXED_DELAY_MS:1800000}
job.ingestion.scheduler.initial-delay-ms=${JOB_INGESTION_SCHEDULER_INITIAL_DELAY_MS:60000}
job.ingestion.scheduler.max-results=${JOB_INGESTION_SCHEDULER_MAX_RESULTS:50}
job.ingestion.freshness.threshold-days=${JOB_FRESHNESS_THRESHOLD_DAYS:7}

# ── Logging ──────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.dotfield=INFO

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false